<form action="/guardar" method="post">  
    <fieldset>
        <legend>Modalidad de la clase</legend>
        <label>
            <input type="radio" name="modalidad" value="presencial">
            Presencial
        </label>
        <label>
            <input type="radio" name="modalidad" value="virtual">
            Virtual
        </label>
    </fieldset>
    <br><br>
    <label for ="turno">Turno</label>
    <select name="turno" id="turno">
        <option value="A">Turno A</option>
        <option value="B">Turno B</option>
        <option value="C">Turno C</option>
    </select>
    <br><br>
    <label for="comentarios">Comentarios</label>
    <textarea name="comentarios" id="comentarios" cols="30" rows="10"></textarea>
    <br>
    <button type="button"></button>Acciones:</button>
    <br>

    <button type="button">Vista Previa</button>
    <br>

    <button type="reset">Limpiar   </button>
    <br>
    <button type="submit">Guardar</button>



</form>
